name: Deploy Lila's Nature Explorer

on:
  push:
    branches: [main, master, 'claude/kids-exploration-game-gKkoc']
  workflow_dispatch: # lets you trigger manually from GitHub website

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: LilaExplorer/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: LilaExplorer

      - name: Build web app
        run: EXPO_NO_TELEMETRY=1 npx expo export --platform web
        working-directory: LilaExplorer

      - name: Fix script tag for ES module compatibility
        run: sed -i 's/ defer><\/script>/ type="module"><\/script>/' LilaExplorer/dist/index.html

      - name: Add Lila & the Song of the Sea (docs/sea) to the site
        run: cp -r docs/sea LilaExplorer/dist/sea

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: LilaExplorer/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
